<style>:root{--bg:#f4f7fb;--card:#fff;--ink:#0e1b2e;--mute:#5a6b82;--line:#dbe3ee;--c1:#0b8fc7;--hero1:#0e2a4d;--hero2:#4a2f9c;--sh:0 6px 24px rgba(14,27,46,.07)}

*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 'IBM Plex Sans',system-ui,sans-serif;padding-inline:max(16px,env(safe-area-inset-left,0px))}

.hero h1{font-size:clamp(2rem,8vw,3rem);font-weight:800;letter-spacing:-.02em}.hero p{margin:8px 0 0;color:#cfd9ee}
main{max-width:620px;margin:0 auto;padding-block:8px 40px}
h2{font-size:.8rem;text-transform:uppercase;letter-spacing:.1em;color:var(--c1);margin:24px 0 10px}
a.t{display:block;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin-bottom:10px;color:var(--ink);text-decoration:none;font-weight:600;box-shadow:var(--sh)}
